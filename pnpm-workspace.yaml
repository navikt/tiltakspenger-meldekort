packages:
  - 'packages/*'
allowBuilds:
  esbuild: true
  unrs-resolver: true
injectWorkspacePackages: true

# en uke
minimumReleaseAge: 10080
# Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
minimumReleaseAgeExclude:
  - "@navikt/*"
  - "@nais/*"
  # body-parser 2.3.0 krasjer prosessen på én request med Content-Encoding og etterfølgende bytes (GHSA-27r3-jxmh-p828).
  # Serveren bruker express.json() på alle ruter. Fjernes når 2.4.0 er eldre enn cooldownen.
  - "body-parser@2.4.0"

# Sikkerhetsfikser i transitive pakker: qs og body-parser kommer via express, som bare tillater (ikke krever) fikset versjon.
# Fjernes når foreldrepakken selv krever fikset versjon (`pnpm why <pakke>`).
# qs 6.16.1 tetter CVE-2026-110816.
# source-map-js kommer via postcss i vite, som bare tillater (ikke krever) 1.2.2 med fiks for CVE-2026-93749.
overrides:
  qs: 6.16.1
  body-parser: 2.4.0
  "source-map-js@<1.2.2": 1.2.2
