name: Build for deploy

# Lokalt image-bygg (bevisst ikke delt, jf. metarepo-README): next-bygg, CDN-opplasting av statiske assets og docker-image.
on:
  workflow_call:
    outputs:
      IMAGE:
        description: "Docker image"
        value: ${{ jobs.build.outputs.IMAGE }}
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      READER_TOKEN:
        required: true

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # id-token: write er kun for OIDC-føderasjonen i docker-build-push/cdn-upload; GITHUB_TOKEN har bare lesetilgang.
    permissions:
      contents: read
      id-token: write
    outputs:
      IMAGE: ${{ steps.docker-push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          # Ikke la tokenet ligge igjen i .git/config - stegene kjører avhengigheters kode.
          persist-credentials: false
      # pnpm-versjonen leses fra packageManager-feltet i package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Build app
        run: pnpm run build
        env:
          ASSETS_URL: https://cdn.nav.no/tpts/tp-meldekort
      - name: Create production node_modules for server
        run: pnpm deploy --filter @meldekort/server --prod deploy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      # Actionen bor i nais/deploy-repoet og versjoneres i stien (/v2); som resten av Nav bruker vi @master, låst til commit i actions.lock.
      - name: Upload static assets to Nav CDN
        uses: nais/deploy/actions/cdn-upload/v2@master
        with:
          team: tpts
          source: ./packages/server/dist/client/assets
          destination: tp-meldekort
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Build and push docker image
        # Versjonsoversikt: https://github.com/nais/docker-build-push/tags
        uses: nais/docker-build-push@main
        id: docker-push
        with:
          team: tpts
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
